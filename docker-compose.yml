services:
  smartthings-pat-rotator:
    build: .
    image: smartthings-pat-rotator:latest
    container_name: smartthings-pat-rotator
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Mount the data folder containing the 1-time authenticated session
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

