[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartthings-pat-refresher"
version = "1.0.0"
description = "Keep SmartThings working for free: automated 24-hour PAT rotator and HACS integration"
readme = "README.md"
authors = [{ name = "willyzha" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
    "aiomqtt>=2.0.0",
    "paho-mqtt>=2.0.0",
]

[project.optional-dependencies]
rotator = [
    "playwright==1.49.1",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[project.scripts]
smartthings-pat-rotator = "rotator.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.hatch.build.targets.wheel]
packages = ["rotator"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
