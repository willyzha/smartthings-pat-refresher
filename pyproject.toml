[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "smartthings-plus"
version = "1.0.0"
description = "Home Assistant HACS integration for SmartThings with automated OAuth2 rolling token renewal and local polling"
readme = "README.md"
authors = [{ name = "willyzha" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
